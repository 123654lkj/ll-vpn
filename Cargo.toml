[package]
name = "ll-vpn"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
snow = { version = "0.9", features = ["default-resolver"] }
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tokio-test = "0.4"
